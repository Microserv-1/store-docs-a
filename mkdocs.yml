site_name: Microserv Store
site_description: Documentação técnica do projeto e contribuição de Yuri Henrique.
site_url: https://microserv-1.github.io/store-docs-a/
repo_url: https://github.com/Microserv-1/store-root

theme:
  name: material
  language: pt-BR
  features: [content.code.copy]
markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Visão geral: index.md
  - APIs: contracts.md
  - Execução: deploy.md
  - CI/CD: jenkins.md
  - Gargalos e testes: bottlenecks.md
  - Custos e SLA: operations.md
  - Decisões e IA: decisions.md
  - Apresentação: presentation.md
  - Evidências: evidence-index.md

# Anexos permanecem publicados e vinculados na página Evidências.
not_in_nav: |
  /aws-final-review.md
  /aws-pause.md
  /aws-resume.md
  /aws-shutdown.md
  /budget-window.md
  /calculator-inputs.md
  /closure.md
  /delivery.md
  /eks-load.md
  /eks-preparation.md
  /final-test-plan.md
  /final-validation.md
  /integration.md
  /project-video.md
  /right-sizing.md
  /status.md
  /teacher-evaluation.md
